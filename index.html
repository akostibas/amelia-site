<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amelia's Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="sun"></div>
    <div class="earth">🌍</div>
    <div class="moon"></div>

    <!-- pink and brown stars in the sky -->
    <div class="stars">
      <i style="left:6vw;  top:6vh;  --s:4vh; background:#ff9ecb;"></i>
      <i style="left:15vw; top:14vh; --s:3vh; background:#a0703c;"></i>
      <i style="left:23vw; top:4vh;  --s:5vh; background:#ff9ecb;"></i>
      <i style="left:30vw; top:20vh; --s:3vh; background:#a0703c;"></i>
      <i style="left:38vw; top:9vh;  --s:4vh; background:#ff9ecb;"></i>
      <i style="left:46vw; top:2vh;  --s:3vh; background:#a0703c;"></i>
      <i style="left:62vw; top:18vh; --s:4vh; background:#ff9ecb;"></i>
      <i style="left:70vw; top:7vh;  --s:5vh; background:#a0703c;"></i>
      <i style="left:78vw; top:22vh; --s:3vh; background:#ff9ecb;"></i>
      <i style="left:88vw; top:12vh; --s:4vh; background:#a0703c;"></i>
      <i style="left:94vw; top:24vh; --s:3vh; background:#ff9ecb;"></i>
      <i style="left:54vw; top:26vh; --s:3vh; background:#a0703c;"></i>
    </div>

    <!-- two rainbows -->
    <svg class="rainbow rainbow-1" viewBox="0 0 200 105">
      <g fill="none" stroke-width="9">
        <path d="M10 100 A90 90 0 0 1 190 100" stroke="#ff595e"/>
        <path d="M19 100 A81 81 0 0 1 181 100" stroke="#ff924c"/>
        <path d="M28 100 A72 72 0 0 1 172 100" stroke="#ffca3a"/>
        <path d="M37 100 A63 63 0 0 1 163 100" stroke="#8ac926"/>
        <path d="M46 100 A54 54 0 0 1 154 100" stroke="#1982c4"/>
        <path d="M55 100 A45 45 0 0 1 145 100" stroke="#6a4c93"/>
      </g>
    </svg>
    <svg class="rainbow rainbow-2" viewBox="0 0 200 105">
      <g fill="none" stroke-width="9">
        <path d="M10 100 A90 90 0 0 1 190 100" stroke="#ff595e"/>
        <path d="M19 100 A81 81 0 0 1 181 100" stroke="#ff924c"/>
        <path d="M28 100 A72 72 0 0 1 172 100" stroke="#ffca3a"/>
        <path d="M37 100 A63 63 0 0 1 163 100" stroke="#8ac926"/>
        <path d="M46 100 A54 54 0 0 1 154 100" stroke="#1982c4"/>
        <path d="M55 100 A45 45 0 0 1 145 100" stroke="#6a4c93"/>
      </g>
    </svg>

    <!-- disco balls hanging under the rainbows -->
    <div class="disco" style="left:24vw; top:18vh;">
      <div class="string"></div><div class="ball"></div>
    </div>
    <div class="disco" style="left:70vw; top:14vh; animation-delay:-1.5s;">
      <div class="string"></div><div class="ball"></div>
    </div>

    <!-- gnome (left) -->
    <svg class="gnome gnome-left" viewBox="0 0 100 150">
      <ellipse cx="50" cy="134" rx="27" ry="16" fill="#2f8f4e"/>
      <circle cx="50" cy="82" r="24" fill="#f6c9a6"/>
      <path d="M50 4 L13 78 Q50 62 87 78 Z" fill="#e23b3b"/>
      <path d="M26 80 Q50 165 74 80 Q50 102 26 80 Z" fill="#ffffff"/>
      <circle cx="50" cy="88" r="9" fill="#e8a87c"/>
    </svg>

    <div class="unicorn"><span class="u-inner">🦄</span></div>

    <!-- gnome (right) -->
    <svg class="gnome gnome-right" viewBox="0 0 100 150">
      <ellipse cx="50" cy="134" rx="27" ry="16" fill="#3a7bd5"/>
      <circle cx="50" cy="82" r="24" fill="#f6c9a6"/>
      <path d="M50 4 L13 78 Q50 62 87 78 Z" fill="#e23b3b"/>
      <path d="M26 80 Q50 165 74 80 Q50 102 26 80 Z" fill="#ffffff"/>
      <circle cx="50" cy="88" r="9" fill="#e8a87c"/>
    </svg>

    <!-- talking speech bubbles -->
    <div class="bubble bubble-uni">
      <span>Hi Amelia!</span><span>I love grass!</span><span>Wheee!</span>
    </div>
    <div class="bubble bubble-gl">
      <span>Let's dance!</span><span>Tee hee!</span><span>La la la!</span>
    </div>
    <div class="bubble bubble-gr">
      <span>On the moon!</span><span>So much fun!</span><span>Yay!</span>
    </div>

    <div class="grass"></div>
    <div class="moongrass"></div>
    <div class="minis">
      <span style="left:7vw;  bottom:2vh;  font-size:3vh;">🍄</span>
      <span style="left:14vw; bottom:8vh;  font-size:2.4vh;">🐞</span>
      <span style="left:22vw; bottom:4vh;  font-size:2.6vh;">🐌</span>
      <span style="left:30vw; bottom:9vh;  font-size:2.4vh;">🐝</span>
      <span style="left:38vw; bottom:2vh;  font-size:3vh;">🍄</span>
      <span style="left:45vw; bottom:7vh;  font-size:2.6vh;">🐛</span>
      <span style="left:53vw; bottom:3vh;  font-size:2.4vh;">🐜</span>
      <span style="left:60vw; bottom:8vh;  font-size:2.8vh;">🦋</span>
      <span style="left:68vw; bottom:2vh;  font-size:3vh;">🍄</span>
      <span style="left:75vw; bottom:6vh;  font-size:2.4vh;">🐞</span>
      <span style="left:83vw; bottom:3vh;  font-size:2.6vh;">🐌</span>
      <span style="left:90vw; bottom:9vh;  font-size:2.4vh;">🐝</span>
      <span style="left:96vw; bottom:4vh;  font-size:2.8vh;">🦋</span>
    </div>
    <div class="flowers">
      <span style="left:4vw;  bottom:6vh;  font-size:6vh;">🌷</span>
      <span style="left:11vw; bottom:14vh; font-size:5vh;">🌸</span>
      <span style="left:17vw; bottom:3vh;  font-size:7vh;">🌼</span>
      <span style="left:26vw; bottom:10vh; font-size:5vh;">🌺</span>
      <span style="left:33vw; bottom:4vh;  font-size:6vh;">🌻</span>
      <span style="left:41vw; bottom:12vh; font-size:5vh;">🌷</span>
      <span style="left:49vw; bottom:5vh;  font-size:7vh;">🌸</span>
      <span style="left:57vw; bottom:13vh; font-size:5vh;">🌼</span>
      <span style="left:64vw; bottom:3vh;  font-size:6vh;">🌺</span>
      <span style="left:71vw; bottom:11vh; font-size:6vh;">🌻</span>
      <span style="left:79vw; bottom:5vh;  font-size:7vh;">🌷</span>
      <span style="left:86vw; bottom:13vh; font-size:5vh;">🌸</span>
      <span style="left:93vw; bottom:7vh;  font-size:6vh;">🌼</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
